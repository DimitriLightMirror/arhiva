services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Point the app at the ollama service below (compose DNS name).
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      TESSERACT_LANG: ${TESSERACT_LANG:-ron}
    volumes:
      # Archive tree + scanner watch folder persist on the host SSD.
      - ./archive:/data/archive
      - ./watch:/data/watch
      - ./jobs:/data/jobs
    restart: unless-stopped

  # Optional local LLM service. To use a GPU, add the appropriate
  # deploy.resources reservations for your driver.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    profiles: ["llm"]

volumes:
  ollama_models:
